<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreeHand</title>
<!-- Added to the Home Screen, the page opens full screen without Safari's bars (docs/tooling.md, "Full screen"). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FreeHand">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
/* Fonts are self-hosted (latin subset) so the page makes no network request beyond its own origin and works offline.
   Bricolage Grotesque and Instrument Sans are variable files: one file covers every weight used. */
@font-face { font-family: "Bricolage Grotesque"; src: url(fonts/bricolage-grotesque.woff2) format("woff2"); font-weight: 200 800; font-stretch: 100%; font-display: swap; }
@font-face { font-family: "Instrument Sans"; src: url(fonts/instrument-sans.woff2) format("woff2"); font-weight: 400 700; font-stretch: 100%; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(fonts/ibm-plex-mono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(fonts/ibm-plex-mono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
/* The hidden attribute must win over the display rules below (the Again button is toggled with it). */
[hidden] { display: none !important; }
/* Layout: a drawing board. One sheet of layout paper fills the screen; the marking slip sits beside it (below it when the tablet is upright).
   Light = layout paper, blue pencil for what is given, carmine pencil for corrections. Dark = green cutting mat, chalk lines. */
:root {
  --bg: #e6eae6; --paper: #fbfbf7; --panel: #f1f4f0; --fg: #23272b; --muted: #636b70; --line: #cdd4ce;
  --ink: #262a30; --sketch: #8a6fd1; --blue: #2779b8; --red: #d0244d; --chip: #e1e6e1; --chip-on: #23272b; --chip-on-fg: #fbfbf7;
  --good: #2c8155; --warn: #b3730c; --bad: #c8343d;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --ui: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1f1b; --paper: #183029; --panel: #142823; --fg: #ecf1e9; --muted: #9cb2a8; --line: #2d4a41;
  --ink: #f1f4ea; --sketch: #c3a9ff; --blue: #7ec3ee; --red: #ff7f96; --chip: #20392f; --chip-on: #ecf1e9; --chip-on-fg: #142823;
  --good: #71d49b; --warn: #efc162; --bad: #ff8d80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1f1b; --paper: #183029; --panel: #142823; --fg: #ecf1e9; --muted: #9cb2a8; --line: #2d4a41;
  --ink: #f1f4ea; --sketch: #c3a9ff; --blue: #7ec3ee; --red: #ff7f96; --chip: #20392f; --chip-on: #ecf1e9; --chip-on-fg: #142823;
  --good: #71d49b; --warn: #efc162; --bad: #ff8d80; color-scheme: dark }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; line-height: 1.4; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.app { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 10px 12px;
  /* Full screen from the Home Screen: stay clear of the status bar and rounded corners. */
  padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }

.bar { display: flex; align-items: center; gap: 8px 22px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -0.02em; line-height: 1; }
.brand i { font-style: normal; color: var(--red); }
.tabs { display: flex; gap: 4px; }
.tabs button { padding: 8px 14px; min-height: 40px; font-weight: 600; font-size: 16px; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--red); }
.tally { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--muted); }

.drills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
.drills::-webkit-scrollbar { display: none; }
.drills button { flex: none; padding: 8px 14px; min-height: 40px; border-radius: 8px; background: var(--chip); font-weight: 500; white-space: nowrap; }
.drills button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }
.drills .free { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 6px; opacity: 0.7; }

.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 12px; }
.stage { position: relative; min-height: 0; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
/* Buttons and the task line sit at the top of the sheet: the drawing hand rests on the bottom edge
   and kept pressing Check and Next when the buttons were there. */
.top { position: absolute; top: 8px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.task { padding: 0 4px; font-size: 14px; line-height: 1.3; font-weight: 500; color: var(--muted); }
.tools { display: flex; gap: 8px; }
.tools button { pointer-events: auto; min-height: 46px; padding: 0 18px; border-radius: 10px; font-weight: 600; background: var(--panel); border: 1px solid var(--line); }
.tools button:disabled { opacity: 0.4; cursor: default; }
.tools .gap { flex: 1; }
/* Pen switch: sketch (drafting, not marked), final (the answer), eraser. Joined so it reads as one control. */
.pens { display: flex; pointer-events: auto; }
.pens button { border-radius: 0; margin-left: -1px; padding: 0 14px; }
.pens button:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }
.pens button:last-child { border-radius: 0 10px 10px 0; }
.pens button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); }
.pens .sw { display: inline-block; width: 16px; margin-right: 7px; vertical-align: middle; border-radius: 2px; background: var(--ink); height: 3px; }
.pens [data-tool="sketch"] .sw { background: var(--sketch); height: 2px; }
.pens [data-tool="final"][aria-pressed="true"] .sw { background: var(--chip-on-fg); }
.tools .primary { background: var(--chip-on); color: var(--chip-on-fg); border-color: var(--chip-on); min-width: 112px; }

.panel { min-height: 0; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; -webkit-user-select: text; user-select: text; }
.panel h3 { margin: 0 0 8px; font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.opt { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.opt:last-child { margin-bottom: 0; }
.opt span { font-size: 13px; color: var(--muted); }
.opt div { display: flex; flex-wrap: wrap; gap: 5px; }
.opt button { padding: 6px 11px; min-height: 34px; border-radius: 999px; background: var(--chip); font-size: 14px; }
.opt button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg); }

.res-top { display: flex; gap: 14px; align-items: flex-start; }
.score { font-family: var(--display); font-weight: 700; font-size: 52px; line-height: 0.9; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score small { display: block; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); margin-top: 6px; }
.score.good { color: var(--good); } .score.warn { color: var(--warn); } .score.bad { color: var(--bad); }
.res h2 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.res .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.rows { margin: 12px 0 0; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 2px 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.row dt { grid-column: 2; font-size: 13px; color: var(--muted); }
.row dd { grid-column: 2; margin: 0; }
.row .mark { grid-row: 1 / span 2; width: 9px; height: 9px; margin-top: 5px; background: var(--line); border-radius: 50%; }
.row.good .mark { background: var(--good); }
.row.warn .mark { background: var(--warn); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.row.bad .mark { background: var(--bad); border-radius: 1px; }
.notes { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.how { margin: 0; color: var(--muted); }
.hist { display: flex; align-items: flex-end; gap: 12px; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 34px; flex: 1; min-width: 0; }
.bars i { flex: 1; max-width: 16px; min-height: 2px; background: var(--muted); border-radius: 2px 2px 0 0; }
.bars i.good { background: var(--good); } .bars i.warn { background: var(--warn); } .bars i.bad { background: var(--bad); }
.hist b { font-family: var(--mono); font-weight: 500; font-size: 14px; white-space: nowrap; }

@media (max-width: 880px), (orientation: portrait) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.55fr) minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .brand { font-size: 20px; } .tabs button { padding: 8px 10px; font-size: 15px; } .tally { width: 100%; margin-left: 0; display: none; }
  .task { font-size: 13px; } .tools { flex-wrap: wrap; } .tools button { padding: 0 13px; } .pens button { padding: 0 10px; } .tools .primary { min-width: 88px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">Free<i>Hand</i></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <div class="tally" id="tally"></div>
  </header>
  <div class="drills" id="drills" role="group" aria-label="Exercises"></div>
  <main class="work">
    <section class="stage" id="stage">
      <canvas id="pad" aria-label="Drawing sheet"></canvas>
      <div class="top" id="top">
      <div class="tools">
        <button id="undo" type="button">Undo</button>
        <button id="clear" type="button">Clear</button>
        <span class="pens" role="group" aria-label="Pen">
          <button type="button" data-tool="sketch" aria-pressed="false"><i class="sw"></i>Sketch</button>
          <button type="button" data-tool="final" aria-pressed="true"><i class="sw"></i>Final</button>
          <button type="button" data-tool="erase" aria-pressed="false">Eraser</button>
        </span>
        <span class="gap"></span>
        <button id="again" type="button" hidden>Again</button>
        <button id="go" type="button" class="primary">Check</button>
      </div>
      <div class="task" id="task"></div>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>
<script type="module" src="ui.js"></script>
</body>
</html>
